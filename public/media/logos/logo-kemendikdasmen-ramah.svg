<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%">
  <!-- Top: K E M E N D I K D A S M E N -->
  <text x="260" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="20" fill="#ea580c" letter-spacing="11">
    KEMENDIKDASMEN
  </text>

  <!-- Center word: RAMAH (Rounded Blue) -->
  <text x="260" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="124" fill="#0096db" letter-spacing="4">
    RAMAH
  </text>

  <!-- Smile Swoosh Curve -->
  <path d="M 50,135 Q 260,215 410,155" fill="none" stroke="#0096db" stroke-width="16" stroke-linecap="round" />

  <!-- Subtitle Bottom: Responsif ◆ Akuntabel ◆ Melayani ◆ Adaptif ◆ Harmonis -->
  <g transform="translate(260, 222)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="14" fill="#1e293b" letter-spacing="0.5">
      Responsif <tspan fill="#0096db">◆</tspan> Akuntabel <tspan fill="#0096db">◆</tspan> Melayani <tspan fill="#0096db">◆</tspan> Adaptif <tspan fill="#0096db">◆</tspan> Harmonis
    </text>
  </g>
