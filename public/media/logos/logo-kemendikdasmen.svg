<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <path id="text-curve" d="M 155,145 A 110,110 0 0,1 345,145" fill="none" />
  </defs>

  <!-- Blue Pentagon Shield -->
  <polygon points="250,25 365,115 320,240 180,240 135,115" fill="#0088cc" stroke="#0072ab" stroke-width="2" />

  <!-- Tut Wuri Handayani Text Arch -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#1e293b" letter-spacing="3.5">
    <textPath href="#text-curve" startOffset="50%" text-anchor="middle">
      TUT WURI HANDAYANI
    </textPath>
  </text>

  <!-- Wing Elements Left & Right -->
  <!-- Left Wings -->
  <path d="M 230,175 C 190,165 160,135 155,160 C 150,185 185,200 220,195 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
  <path d="M 230,155 C 175,140 150,105 145,130 C 140,155 175,175 225,175 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
  <!-- Right Wings -->
  <path d="M 270,175 C 310,165 340,135 345,160 C 350,185 315,200 280,195 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
  <path d="M 270,155 C 325,140 350,105 355,130 C 360,155 325,175 275,175 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />

  <!-- Central Crest / Crown Body -->
  <path d="M 215,190 C 215,100 230,65 250,65 C 270,65 285,100 285,190 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3.5" />
  <path d="M 235,185 L 235,90 C 240,75 260,75 265,90 L 265,185 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2" />

  <!-- Golden Central Flame -->
  <path d="M 250,120 C 238,135 240,160 250,170 C 260,160 262,135 250,120 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  <circle cx="250" cy="182" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />

  <!-- Open Book at Base -->
  <path d="M 250,210 L 205,198 L 200,222 L 250,228 L 300,222 L 295,198 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="250" y1="210" x2="250" y2="228" stroke="#1e293b" stroke-width="3" />

  <!-- Brand Typography: Kemendikdasmen -->
  <g transform="translate(250, 340)">
    <text font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5" text-anchor="middle">
      <tspan fill="#0080c8">Kemen</tspan><tspan fill="#f59e0b">dikdasmen</tspan>
    </text>
  </g>
</svg>
